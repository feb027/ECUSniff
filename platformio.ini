; PlatformIO Project Configuration File for Automotive ECU Test Platform (ECUSniff)
; Targets: ESP32 (Wemos D1 R32 base), ESP32-S3 (8MB Flash / 8MB PSRAM N8R8)

[platformio]
default_envs = esp32s3

[env]
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -I include

[env:esp32s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.filesystem = littlefs
board_build.partitions = partitions_8MB.csv
board_build.arduino.memory_type = qio_opi
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    bblanchon/ArduinoJson @ ^7.3.0
    https://github.com/igorantolic/ai-esp32-rotary-encoder.git
build_flags = 
    ${env.build_flags}
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:wemos_d1_r32]
platform = espressif32
framework = arduino
board = wemos_d1_uno32
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    bblanchon/ArduinoJson @ ^7.3.0
    https://github.com/igorantolic/ai-esp32-rotary-encoder.git
build_flags = 
    ${env.build_flags}
    -DESP32

[env:native]
platform = native
test_framework = unity
build_flags = 
    -std=c++17
    -I include
    -I lib/engine/include
lib_ignore =
    hal
    webapi
    ui
